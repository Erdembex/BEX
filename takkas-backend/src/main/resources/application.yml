spring:
  application:
    name: takkas-backend
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 60MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/takkas}
    username: ${DB_USER:takkas}
    password: ${DB_PASS:takkas}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-32-chars!!}
    access-token-expiry-ms: 900000
  base-url: ${BASE_URL:http://localhost:8080}
  admin:
    seed-enabled: ${ADMIN_SEED_ENABLED:true}
    email: ${ADMIN_EMAIL:admin@bex.dev}
    password: ${ADMIN_PASSWORD:E123456789y.}
    sync-password-on-startup: ${ADMIN_SYNC_PASSWORD:true}
  demo:
    # Sunum ve saha demosu icin ornek isletme/gorev/kupon verisi uretir.
    # Production'da kapali kalmali.
    seed-enabled: ${DEMO_SEED_ENABLED:false}
    password: ${DEMO_PASSWORD:PasslaDemo1!}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  storage:
    provider: ${STORAGE_PROVIDER:local}
  payment:
    provider: ${APP_PAYMENT_PROVIDER:manual}
  expo:
    access-token: ${EXPO_ACCESS_TOKEN:}
  listings:
    # Yerel geliştirmede true — görev oluşturulunca kullanıcılara hemen görünür.
    # Production profili varsayılan olarak false kullanır (admin moderasyonu).
    auto-approve-on-create: ${LISTINGS_AUTO_APPROVE:true}
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  cors:
    # Virgülle ayrılmış origin kalıpları. Production'da kendi domainlerinizi verin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_S3_REGION:eu-central-1}

iyzico:
  api-key: ${IYZICO_API_KEY:}
  secret-key: ${IYZICO_SECRET_KEY:}
  base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    persist-authorization: true
  default-produces-media-type: application/json