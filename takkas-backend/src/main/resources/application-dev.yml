spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/takkas
    username: ${DB_USER:takkas}
    password: ${DB_PASS:takkas}
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025
    username: ''
    password: ''
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    secret: dev-secret-key-for-local-development-only-min32!!
    access-token-expiry-ms: 3600000
  base-url: http://localhost:8080
  admin:
    seed-enabled: true
  dev:
    expose-password-reset-token: true
    expose-phone-code: true
    expose-email-verification-code: true
  subscription:
    # Yerel testte ücretsiz plan 2 görevle sınırlı; geliştirmede gevşetilir
    max-active-listings-override: 10

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

stripe:
  secret-key: sk_test_placeholder
  webhook-secret: whsec_placeholder

logging:
  level:
    com.takkas: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
