# Production profile — activate with SPRING_PROFILES_ACTIVE=prod

spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 60MB
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    from: ${SPRING_MAIL_FROM:noreply@passla.com.tr}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  admin:
    seed-enabled: ${ADMIN_SEED_ENABLED:false}
    sync-password-on-startup: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://passla.com.tr,https://www.passla.com.tr}
  listings:
    # Production varsayılanı false: her ilan admin moderasyonundan geçer.
    auto-approve-on-create: ${LISTINGS_AUTO_APPROVE:false}
  dev:
    expose-password-reset-token: false
    expose-phone-code: false
    expose-email-verification-code: false
    log-mail-content: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.takkas: INFO
    org.springframework.security: WARN

management:
  health:
    mail:
      enabled: false
